<main class="form-page"><a routerLink="/agent/properties">Back to my properties</a><h1>Edit property</h1>@if(loading){<p>Loading property...</p>}@else{<form [formGroup]="form" (ngSubmit)="save()"><label>Title<input formControlName="title" /></label><label>Description<textarea formControlName="description"></textarea></label><div class="form-grid"><label>Price<input type="number" formControlName="price" /></label><label>Location<input formControlName="location" /></label><label>Type<input formControlName="propertyType" /></label><label>Bedrooms<input type="number" formControlName="bedrooms" /></label><label>Bathrooms<input type="number" formControlName="bathrooms" /></label><label>Area<input type="number" formControlName="area" /></label><label>Image URL<input formControlName="imageUrl" /></label></div>@if(images.length){<div class="image-previews">@for(image of images; track image){<img [src]="image" alt="Property image" />}</div>}<label class="image-upload">Add property images<input type="file" accept="image/jpeg,image/png,image/webp" multiple (change)="selectImages($event)" /></label>@if(previews.length){<div class="image-previews">@for(preview of previews; track preview){<img [src]="preview" alt="Selected property preview" />}</div>}@if(errorMessage){<p class="error">{{errorMessage}}</p>}<button type="submit" [disabled]="submitting">{{submitting ? 'Saving...' : 'Update property'}}</button></form>}</main>
